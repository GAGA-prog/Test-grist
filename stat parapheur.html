<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  body{font-family:Arial,sans-serif;margin:16px;background:#f5f5fe}
  .node{margin:6px 0 6px 18px;border-left:3px solid #000091;padding-left:10px}
  .head{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;background:#fff;border:1px solid #ddd}
  .DG>.head{background:#000091;color:#fff;font-weight:bold}
  .dir>.head{background:#e3e3fd;font-weight:bold}
  .sd>.head{font-weight:bold}
  .n{min-width:32px;text-align:center;background:#000091;color:#fff;border-radius:12px;padding:0 8px}
  .DG>.head .n{background:#fff;color:#000091}
  .zero .n{background:#ccc;color:#555}
</style></head>
<body><h2>Parapheurs par bureau</h2><div id="out">Chargement…</div>
<script>
const TREE={n:"DG",c:[
 {n:"DE",c:[
  {n:"SD1",c:["1A","1B","1C"]},
  {n:"SD2",c:["2A","2B","2C","2D","2E"]},
  {n:"SD3",c:["3A","3B","3C","FACE"]},
  {n:"SD4",c:["4A","4B","4C"]}]},
 {n:"DC",c:[
  {n:"SDAC",c:["BESNBC","BAFCC","BMC","BACC"]},
  {n:"SD5",c:["BQA","5CD","SCN-PNCEE","ZFE"]},
  {n:"SD6",c:["6A","6B","6C","SCN"]}]},
 {n:"SD7",c:["7A","7B","7C","CI"]}]};

let counts={};
function total(node){
  if(typeof node==="string")return counts[node]||0;
  return (counts[node.n]||0)+node.c.reduce((s,x)=>s+total(x),0);
}
function render(node,lvl){
  const name=typeof node==="string"?node:node.n;
  const t=total(node);
  const cls=lvl===0?"DG":lvl===1&&node.n!=="SD7"?"dir":typeof node==="string"?"":"sd";
  let h=`<div class="node ${cls} ${t?"":"zero"}"><div class="head"><span>${name}</span><span class="n">${t}</span></div>`;
  if(typeof node!=="string")h+=node.c.map(x=>render(x,lvl+1)).join("");
  return h+"</div>";
}
grist.ready({columns:[{name:"Services",title:"Services"}],requiredAccess:"read table"});
grist.onRecords(recs=>{
  counts={};
  recs.forEach(r=>{
    const v=String(r.Services||"").trim();
    counts[v]=(counts[v]||0)+1;
  });
  document.getElementById("out").innerHTML=render(TREE,0);
});
</script></body></html>
